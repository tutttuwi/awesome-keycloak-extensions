repo: ChosoMeister/Keycloak-WS-Federation
researched_at: '2026-10-25'
sources:
- https://github.com/ChosoMeister/Keycloak-WS-Federation#readme
can:
- en: Run Keycloak as a WS-Federation 1.2 (passive) IdP/STS for relying parties, with sign-in, sign-out and metadata.
  ja: KeycloakをWS-Federation 1.2（パッシブ）のIdP/STSとして動かせる。サインイン・サインアウト・メタデータ生成に対応
- en: Broker to an external WS-Federation IdP, with attribute-to-user and attribute-to-role mappers.
  ja: 外部のWS-Federation IdPとブローカー連携でき、属性をユーザーやロールにマッピングするマッパーもある
- en: Issue SAML 2.0 or legacy SAML 1.1 assertions, with user attribute/property, group and role mappers.
  ja: SAML 2.0と旧SAML 1.1のアサーションを発行でき、ユーザー属性・プロパティ・グループ・ロールのマッパーに対応
- en: Optionally enable WS-Trust 1.3 `usernamemixed` and `mex` endpoints per realm.
  ja: "realmごとに、WS-Trust 1.3の `usernamemixed` と `mex` エンドポイントを有効にできる"
- en: A maintained rework of the old WildFly-era extension for Quarkus-based Keycloak, with a demo stack and production runbook.
  ja: WildFly時代の旧拡張を、Quarkus版Keycloak向けに作り直してメンテナンスしているもの。デモ環境と本番導入の手順書付き
cannot:
- en: Supports Keycloak 26.7.x only — its minor version must match Keycloak's, because it uses internal SPIs.
  ja: 対応はKeycloak 26.7.xのみ。内部SPIを使うため、マイナーバージョンをKeycloakと一致させる必要がある
- en: Other WS-Trust profiles (Windows or certificate authentication), and attribute and pseudonym services, are out of scope.
  ja: 他のWS-Trustプロファイル（Windows認証・証明書認証）や、属性サービス・仮名サービスは対象外
- en: Interoperability with every AD FS / third-party WS-Fed implementation is not guaranteed.
  ja: すべてのAD FSやサードパーティのWS-Fed実装との相互運用性は保証されていない
- en: Some security corrections (e.g. a mandatory audience check) can break deployments that relied on the old behaviour and cannot be turned off; licensed under AGPL-3.0.
  ja: 一部のセキュリティ修正（audienceチェックの必須化など）は旧来の挙動に頼っていた環境を壊す可能性があり、無効化もできない。ライセンスはAGPL-3.0
requires:
- en: "JDK 21 and Maven 3.9+ to build; copy the JAR into `providers` and run `kc.sh build` (recreate containers to pick up a new version)."
  ja: "ビルドにJDK 21とMaven 3.9以上。JARを `providers` に置いて `kc.sh build`（新しいバージョンを反映するにはコンテナを作り直す）"
