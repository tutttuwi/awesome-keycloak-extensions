repo: softwarefactory-project/keycloak-event-listener-mqtt
researched_at: '2026-10-25'
sources:
- https://github.com/softwarefactory-project/keycloak-event-listener-mqtt#readme
can:
- en: Publish Keycloak events to an MQTT broker.
  ja: KeycloakのイベントをMQTTブローカーへ送信
- en: "Configure broker, credentials (or anonymous), topic (default `keycloak/events`) and optional in-memory persistence."
  ja: "ブローカー、認証情報（匿名も可）、トピック（既定は `keycloak/events`）、メモリ上の永続化を設定できる"
- en: Ships a Dockerfile, compose file and demo script that set up Keycloak with an MQTT server.
  ja: KeycloakとMQTTサーバーを立ち上げるDockerfile・compose・デモスクリプト付き
cannot:
- en: MQTT only; the README does not describe filtering which events are published.
  ja: MQTT専用。どのイベントを送るかの絞り込みはREADMEに記載がない
- en: Tested on Keycloak 22; versions before 22 need a Java 11 rebuild.
  ja: 検証はKeycloak 22。22より前のバージョンではJava 11向けに再ビルドが必要
- en: Inactive — no commits since May 2024.
  ja: 2024年5月以降コミットがなく、活動停止状態
requires:
- en: Copy the JAR to `/opt/keycloak/providers`, pass the MQTT settings as SPI options and enable the listener per realm.
  ja: "JARを `/opt/keycloak/providers` に置き、MQTTの設定をSPIオプションで渡して、realmごとにリスナーを有効化"
