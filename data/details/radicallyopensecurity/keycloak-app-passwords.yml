repo: radicallyopensecurity/keycloak-app-passwords
researched_at: '2026-10-25'
sources:
- https://github.com/radicallyopensecurity/keycloak-app-passwords#readme
- https://github.com/radicallyopensecurity/keycloak-app-passwords/tree/main/extension
can:
- en: Let users generate, list and delete application-specific passwords (stored securely as user attributes) through a REST API.
  ja: アプリ専用パスワードの発行・一覧・削除をREST APIで行える（ユーザー属性に安全に保存）
- en: Check a password against the stored value, e.g. so mail servers (Dovecot/Postfix) can authenticate without the real Keycloak password; works with LDAP federation.
  ja: 保存済みの値とパスワードを照合できる。たとえばメールサーバー（Dovecot/Postfix）が、本来のKeycloakパスワードを使わずに認証できる。LDAPフェデレーションとも連携可能
- en: Includes a Keycloakify theme so users manage their app passwords in the Account UI.
  ja: Keycloakifyのテーマ付きで、ユーザーはアカウント画面からアプリパスワードを管理できる
- en: Restrict the feature to certain groups through a JSON config file.
  ja: JSONの設定ファイルで、機能を使えるグループを限定できる
cannot:
- en: If you already use a custom theme, you must copy the theme files into it by hand.
  ja: 独自テーマを使っている場合は、テーマのファイルを手作業で取り込む必要がある
- en: The bundled docker-compose setup is extremely insecure — development only.
  ja: 付属のdocker-compose構成は非常に安全性が低く、開発専用
- en: Configuration lives in a JSON file, not in the Keycloak admin console.
  ja: 設定はJSONファイルで行い、Keycloakの管理コンソールからは設定できない
- en: Licensed under LGPL-3.0.
  ja: ライセンスはLGPL-3.0
requires:
- en: "Java 21 / Maven / NodeJS to build; put the JAR in `/opt/keycloak/providers` and set the realm theme to `keycloak-app-passwords`."
  ja: "ビルドにJava 21・Maven・NodeJS。JARを `/opt/keycloak/providers` に置き、realmのテーマを `keycloak-app-passwords` にする"
