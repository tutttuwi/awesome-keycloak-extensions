repo: anarsultanov/keycloak-multi-tenancy
researched_at: '2026-10-25'
sources:
- https://github.com/anarsultanov/keycloak-multi-tenancy#readme
- https://sultanov.dev/keycloak-multi-tenancy/
can:
- en: Build B2B multi-tenant IAM in one realm — users create a tenant at registration, review invitations and pick an active tenant at login (required actions).
  ja: 1つのrealmでB2B向けマルチテナントIAMを構築できる。登録時のテナント作成、招待の確認、ログイン時のアクティブテナント選択をRequired Actionで行う
- en: Switch the active tenant without re-login via Application-Initiated Actions (with cancel support).
  ja: Application-Initiated Actionで、再ログインせずにアクティブテナントを切り替えられる（キャンセルも可）
- en: Manage tenants, multi-valued searchable attributes and invitations through a REST API (tenant creator becomes `tenant-admin`; optional realm-wide `manage-tenants`).
  ja: テナント、検索可能な多値属性、招待をREST APIで管理（作成者は `tenant-admin`。realm全体の管理用に `manage-tenants` ロールも設定可能）
- en: Put the active tenant, all tenants or specific tenant attributes into tokens via mappers.
  ja: マッパーで、アクティブテナント・全所属テナント・特定のテナント属性をトークンに追加
- en: Bind IdPs to specific tenants, auto-create memberships on IdP login, and offer a "Login with SSO" option where users type an IdP alias.
  ja: IdPを特定テナントに紐づけ、IdPログイン時に所属を自動作成できる。IdPエイリアスを入力する「Login with SSO」も提供
cannot:
- en: Tenant-specific IdPs are configured through the Keycloak REST API (`multi-tenancy.tenants` attribute), not a dedicated UI.
  ja: テナント専用IdPの設定はKeycloakのREST API（`multi-tenancy.tenants` 属性）で行う必要があり、専用のUIはない
- en: Users logging in through a tenant-specific IdP who are not members of its tenants get an error unless automatic membership is set up.
  ja: テナント専用IdPでログインしたユーザーがそのテナントのメンバーでない場合、所属の自動作成を設定していないとエラーになる
- en: Invitations are only visible to users with a verified email.
  ja: 招待はメール確認済みのユーザーにしか表示されない
- en: Only the most recent Keycloak is targeted (the extension's major version matches Keycloak's).
  ja: 対象は最新のKeycloakのみ（拡張のメジャーバージョンがKeycloakと対応）
requires:
- en: "Copy the JAR to `providers/`, run `kc.sh build`, enable the three required actions in this exact order and turn on `Verify email`."
  ja: "JARを `providers/` に置いて `kc.sh build`。3つのRequired Actionをこの順で有効化し、`Verify email` をオンにする"
